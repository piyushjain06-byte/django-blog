<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1b3c 50%, #2d1b4e 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            max-width: 800px;
        }

        .astronaut {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .astronaut svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(100, 200, 255, 0.5));
        }

        h1 {
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f7dc6f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h2 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #4ecdc4;
        }

        p {
            font-size: 18px;
            color: #b8c5d6;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #4ecdc4;
            border: 2px solid #4ecdc4;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.2);
        }

        .btn-secondary:hover {
            background: #4ecdc4;
            color: #0a0e27;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(78, 205, 196, 0.4);
        }

        .planet {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
        }

        .planet1 {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            top: 10%;
            right: 10%;
            animation: orbit1 20s linear infinite;
            box-shadow: 0 0 60px rgba(240, 147, 251, 0.6);
        }

        .planet2 {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            bottom: 15%;
            left: 8%;
            animation: orbit2 15s linear infinite;
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.6);
        }

        @keyframes orbit1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-30px, 30px) scale(1.1); }
        }

        @keyframes orbit2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -20px) scale(0.9); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 80px; }
            h2 { font-size: 24px; }
            .astronaut { width: 150px; height: 150px; }
            .planet1, .planet2 { display: none; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>

    <div class="container">
        <div class="astronaut">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Astronaut illustration -->
                <ellipse cx="100" cy="140" rx="30" ry="10" fill="rgba(255,255,255,0.1)"/>
                
                <!-- Body -->
                <rect x="70" y="100" width="60" height="70" rx="10" fill="#e8eaf6"/>
                <circle cx="100" cy="60" r="35" fill="#fff"/>
                
                <!-- Helmet shine -->
                <circle cx="90" cy="50" r="15" fill="rgba(255,255,255,0.3)"/>
                
                <!-- Visor -->
                <ellipse cx="100" cy="65" rx="25" ry="20" fill="#1e3a5f"/>
                <ellipse cx="95" cy="62" rx="8" ry="10" fill="rgba(255,255,255,0.5)"/>
                
                <!-- Arms -->
                <rect x="50" y="105" width="15" height="50" rx="7" fill="#e8eaf6" transform="rotate(-20 57 130)"/>
                <rect x="135" y="105" width="15" height="50" rx="7" fill="#e8eaf6" transform="rotate(20 143 130)"/>
                
                <!-- Legs -->
                <rect x="75" y="165" width="18" height="25" rx="5" fill="#c5cae9"/>
                <rect x="107" y="165" width="18" height="25" rx="5" fill="#c5cae9"/>
                
                <!-- Details -->
                <circle cx="100" cy="120" r="8" fill="#ff6b6b"/>
                <rect x="85" y="135" width="30" height="3" fill="#9fa8da"/>
                <rect x="85" y="142" width="30" height="3" fill="#9fa8da"/>
            </svg>
        </div>

        <h1>404</h1>
        <h2>Oops! This page doesn't exist.</h2>
        <p>The page you're looking for has drifted off into deep space.<br>Even our best astronauts couldn't find it!</p>

        <div class="buttons">
            <a href="/" class="btn btn-primary">Return to Earth</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Mouse parallax effect
        document.addEventListener('mousemove', (e) => {
            const astronaut = document.querySelector('.astronaut');
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            astronaut.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
